# The manager password has no lockout: cap the attempts for everyone at once.
# Keyed on a constant ($server_port): an empty key would not be counted at all.
limit_req_zone $server_port zone=manager_auth:1m rate=1r/s;
# PIN checks, per client (first forwarded address when behind a proxy).
map $http_x_forwarded_for $client_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $client_key zone=pin_check:10m rate=30r/s;
limit_req_status 429;

server {
    listen 3000;

    include /etc/nginx/frame-ancestors.inc;

    root /app/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /branding/ {
        alias /app/config/branding/;
    }

    location /media/ {
        alias /app/config/media/;
        types {
            image/png png;
            image/jpeg jpg;
            image/webp webp;
            image/gif gif;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            video/mp4 mp4;
            video/webm webm;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
    }

    location = /api/auth/manager {
        limit_req zone=manager_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location = /api/games/check {
        limit_req zone=pin_check burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location /api {
        client_max_body_size 101m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
